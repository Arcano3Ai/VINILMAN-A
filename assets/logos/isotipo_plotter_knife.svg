<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="isoDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- ISOTIPO OFICIAL VINILMANÍA -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="#FFFFFF" stroke="#111111" stroke-width="4" filter="url(#isoDrop)" />
  <rect x="16" y="16" width="88" height="88" rx="18" fill="url(#isoGrad)" />
  
  <!-- Stylized Plotter Blade V -->
  <path d="M 38 34 L 60 82 L 82 34 L 70 34 L 60 60 L 50 34 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Sparkles -->
  <polygon points="60,21 63.5,27.5 70,29 63.5,32.5 60,39 56.5,32.5 50,29 56.5,27.5" fill="#FACC15" stroke="#111111" stroke-width="1.5" />
  <polygon points="86,78 88,82 92,84 88,86 86,90 84,86 80,84 84,82" fill="#FFFFFF" stroke="#111111" stroke-width="1.2" />
  <polygon points="32,78 33.5,81 36.5,82.5 33.5,84 32,87 30.5,84 27.5,82.5 30.5,81" fill="#FACC15" stroke="#111111" stroke-width="1.2" />
  
  <!-- Vinyl cut guide line -->
  <line x1="28" y1="96" x2="92" y2="96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />
</svg>
