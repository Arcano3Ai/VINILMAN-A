<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- Outer Die-Cut Sticker Shape -->
  <circle cx="115" cy="115" r="105" fill="#FFFFFF" stroke="#111111" stroke-width="6" filter="url(#badgeShadow)" />
  <circle cx="115" cy="115" r="95" fill="url(#badgeGrad)" />

  <!-- Plotter Cut Dashed Ring -->
  <circle cx="115" cy="115" r="86" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.9" />

  <!-- Plotter Blade / Cutting Stylized 'V' -->
  <path d="M 75 60 L 115 142 L 155 60 L 135 60 L 115 106 L 95 60 Z" fill="#FFFFFF" stroke="#111111" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Brand Typography Curved / Centered -->
  <g transform="translate(115, 178)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#111111" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="5" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="14" font-weight="900" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
      VINIL<tspan fill="#EC4899">MANÍA</tspan>
    </text>
  </g>

  <!-- Sparkles & Stars -->
  <polygon points="115,35 119,43 127,45 119,49 115,57 111,49 103,45 111,43" fill="#FACC15" stroke="#111111" stroke-width="1.8" />
  <polygon points="175,120 178,125 184,127 178,129 175,135 172,129 166,127 172,125" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" />
  <polygon points="55,120 58,125 64,127 58,129 55,135 52,129 46,127 52,125" fill="#FACC15" stroke="#111111" stroke-width="1.5" />
</svg>
