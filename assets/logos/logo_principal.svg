<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="stickerDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>

  <!-- ISOTIPO BADGE (Plotter Knife & Vinyl Cut) -->
  <g transform="translate(10, 10)">
    <!-- Sticker background -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#FFFFFF" stroke="#111111" stroke-width="4" filter="url(#stickerDrop)" />
    <rect x="6" y="6" width="88" height="88" rx="18" fill="url(#primaryGrad)" />
    
    <!-- Plotter Blade / Cutting Stylized 'V' -->
    <path d="M 28 24 L 50 72 L 72 24 L 60 24 L 50 50 L 40 24 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Sparkles -->
    <polygon points="50,11 53.5,17.5 60,19 53.5,22.5 50,29 46.5,22.5 40,19 46.5,17.5" fill="#FACC15" stroke="#111111" stroke-width="1.5" />
    <polygon points="76,68 78,72 82,74 78,76 76,80 74,76 70,74 74,72" fill="#FFFFFF" stroke="#111111" stroke-width="1.2" />
    <polygon points="22,68 23.5,71 26.5,72.5 23.5,74 22,77 20.5,74 17.5,72.5 20.5,71" fill="#FACC15" stroke="#111111" stroke-width="1.2" />
    
    <!-- Vinyl cutting dashes -->
    <line x1="18" y1="86" x2="82" y2="86" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />
  </g>

  <!-- LOGOTIPO TYPOGRAPHY (Sticker Style) -->
  <g transform="translate(125, 12)">
    <!-- Text Shadow / Die-cut border effect -->
    <text x="0" y="62" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#111111">
      VINIL<tspan fill="#111111">MANÍA</tspan>
    </text>
    
    <!-- Main Text Overlay -->
    <text x="-2" y="60" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#111111">
      VINIL<tspan fill="url(#pinkGrad)">MANÍA</tspan>
    </text>

    <!-- Star Accent -->
    <polygon points="275,20 279,28 288,30 279,34 275,43 271,34 262,30 271,28" fill="#FACC15" stroke="#111111" stroke-width="2" />
    <!-- Mini Sparkle -->
    <polygon points="380,48 382,52 386,53 382,55 380,59 378,55 374,53 378,52" fill="#7C3AED" />

    <!-- Slogan Subtitle with Sticker Bar -->
    <g transform="translate(0, 74)">
      <rect x="0" y="0" width="370" height="24" rx="12" fill="#111111" />
      <text x="18" y="16" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-transform="uppercase">
        TU IDEA • TU ESTILO • TU MANÍA
      </text>
      <circle cx="355" cy="12" r="4" fill="#FACC15" />
    </g>
  </g>
</svg>
