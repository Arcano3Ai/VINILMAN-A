<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#111111" />
    </filter>
  </defs>
  <!-- Background Sticker Shape -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#FFFFFF" stroke="#111111" stroke-width="4" filter="url(#shadow)" />
  <rect x="10" y="10" width="80" height="80" rx="18" fill="url(#grad)" />
  
  <!-- Plotter Blade / Cutting Stylized 'V' -->
  <path d="M 28 26 L 50 68 L 72 26 L 60 26 L 50 48 L 40 26 Z" fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Sparkles / Star -->
  <polygon points="50,14 53,20 59,23 53,26 50,32 47,26 41,23 47,20" fill="#FACC15" stroke="#111111" stroke-width="1.5" />
  <polygon points="76,66 78,70 82,72 78,74 76,78 74,74 70,72 74,70" fill="#FFFFFF" stroke="#111111" stroke-width="1" />
  <polygon points="22,66 23.5,69 26.5,70.5 23.5,72 22,75 20.5,72 17.5,70.5 20.5,69" fill="#FACC15" stroke="#111111" stroke-width="1" />
  
  <!-- Plotter Cut line dots -->
  <line x1="20" y1="84" x2="80" y2="84" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,4" />
</svg>
